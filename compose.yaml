services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: renttool
      MYSQL_USER: renttool
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      retries: 30
  app:
    build: .
    ports: ["127.0.0.1:${APP_PORT:-8088}:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/renttool
      DB_USER: renttool
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    volumes: ["uploads:/app/uploads"]
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
  uploads:
