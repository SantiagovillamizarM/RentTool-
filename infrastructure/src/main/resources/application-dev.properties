# Desarrollo local (perfil predeterminado). No contiene credenciales locales.
# Define DB_PASSWORD, JWT_SECRET, RENTTOOL_ADMIN_EMAIL y RENTTOOL_ADMIN_PASSWORD.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# Activar SQL solo cuando se necesite, mediante SHOW_SQL=true.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
logging.level.root=INFO
logging.level.com.renttool=${RENTTOOL_LOG_LEVEL:DEBUG}

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
