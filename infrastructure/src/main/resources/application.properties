# Configuracion comun de RentTool. Spring pertenece al modulo infrastructure.
spring.application.name=renttool
# Permite seleccionar prod o demo mediante SPRING_PROFILES_ACTIVE.
spring.profiles.default=dev

# Conexion compartida: conserva las variables utilizadas por Docker Compose.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/renttool}
spring.datasource.username=${DB_USER:renttool}
spring.datasource.password=${DB_PASSWORD}
# Flyway administra el esquema en todos los entornos; Hibernate solo lo valida.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Seguridad y opciones propias de los adaptadores de RentTool.
renttool.jwt-secret=${JWT_SECRET}
renttool.upload-dir=${RENTTOOL_UPLOAD_DIR:uploads}
renttool.cors-origins=${RENTTOOL_CORS_ORIGINS:http://localhost:8080}
renttool.time-zone=${RENTTOOL_TIME_ZONE:America/Bogota}

server.port=${SERVER_PORT:8080}
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Conserva /v3/api-docs y las rutas utilizadas por la API y sus pruebas.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.default-produces-media-type=application/json
